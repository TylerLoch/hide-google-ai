<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hide Google AI Overviews and Mode</title>
    <style>
      body {
        --bg: #fff;
        --text: #202020;
        --stone: #e8e8e8;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Inter, Inter-Fallback, Geist, Geist-Fallback, Roboto, Roboto-Fallback, Arial, Arial-Fallback, sans-serif;
        min-width: 15rem;
        padding: 0 .25rem;
        background: var(--bg);
        color: var(--text);
      }
      .setting-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.25rem 0;
      }
      .setting-row span {
        font-size: 1rem;
        text-align: left;
        flex: 1;
      }
      .switch {
        appearance: none;
        position: relative;
        width: 36px;
        height: 21px;
        background-color: var(--stone);
        border-radius: 999px;
        box-shadow: inset 0 0 0 1px #0000000a;
        cursor: pointer;
        transition: background .2s ease;
        flex-shrink: 0;
        margin: 0;
      }
      .switch::before {
        content: "";
        position: absolute;
        height: 17px;
        width: 17px;
        left: 2px;
        top: 2px;
        background-color: white;
        border-radius: 50%;
        box-shadow: 0 1px 2px #0000001f;
        transition: transform .18s cubic-bezier(.2, 0, 0, 1);
      }
      .switch:checked {
        background-color: #00c978;
      }
      .switch:checked::before {
        transform: translateX(15px);
      }
      .header-icons {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: .5rem;
      }
      .header-link-icon {
        color: #888;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color .15s, transform .1s;
        text-decoration: none;
      }
      .header-link-icon:hover {
        color: var(--text);
        transform: scale(1.1);
      }
      .header-link-icon.star-icon:hover {
        color: #fcde8d;
      }
      .header-link-icon.bmc-icon:hover {
        color: #ffdd00;
      }
      .header-icon {
        width: 22px;
        height: 22px;
        user-select: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          --bg: #202020;
          --text: #fff;
          --stone: #2d2d2d;
        }
      }
    </style>
  </head>
  <body>
  </body>
</html>
